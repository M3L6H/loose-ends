<!doctype html>
<html>
  <head>
    <title>Loose Ends</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,close"
    />
    <link rel="stylesheet" href="index.css?v=PLACEHOLDER" />

    <script src="https://cdn.jsdelivr.net/npm/temporal-polyfill@1.0.4/global.min.js"></script>
    <script src="index.js?v=PLACEHOLDER" type="module"></script>
  </head>
  <body>
    <div id="viewport">
      <div id="header">
        <span>Loose Ends</span>
        <span id="controls">
          <button id="add-event-btn" class="button material-symbols-outlined"></button>
        </span>
      </div>
      <main id="content">
        <canvas id="canvas"></canvas>
      </main>
    </div>
    <div id="add-event-modal" class="hidden modal">
      <section class="card">
        <div class="header">
          <span class="title">
            <h2>New Event</h2>
          </span>
          <span class="controls">
            <button class="button close material-symbols-outlined"></button>
          </span>
        </div>
        <div class="body">
          <form>
            <div class="form-input required">
              <label for="event-name">Name</label>
              <input id="event-name" type="text" placeholder="My Event"></input>
            </div>
            <div class="form-input required">
              <label for="event-date">Date</label>
              <input id="event-date" type="text" placeholder="01/01/2010"></input>
            </div>
            <div class="form-input">
              <label for="event-description">Description</label>
              <textarea id="event-description"></textarea>
            </div>
            <div class="form-input required">
              <label for="event-threads">Threads</label>
              <textarea id="event-threads" placeholder="Create My New Thread"></textarea>
            </div>
            <button type="submit">
              Confirm
            </button>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
